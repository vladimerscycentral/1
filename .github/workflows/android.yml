name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['app/**', '*.gradle', 'gradle/**', 'gradle.properties', 'gradlew', '.github/workflows/android.yml']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare optional signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKET_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pocket-signing.keystore"
            chmod 600 "$RUNNER_TEMP/pocket-signing.keystore"
            echo "POCKET_SIGNING_STORE_FILE=$RUNNER_TEMP/pocket-signing.keystore" >> "$GITHUB_ENV"
          fi
      - run: bash gradlew testDebugUnitTest lintDebug assembleDebug
        env:
          POCKET_SIGNING_STORE_PASSWORD: ${{ secrets.POCKET_SIGNING_STORE_PASSWORD }}
          POCKET_SIGNING_KEY_ALIAS: ${{ secrets.POCKET_SIGNING_KEY_ALIAS }}
          POCKET_SIGNING_KEY_PASSWORD: ${{ secrets.POCKET_SIGNING_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-ai-debug
          path: app/build/outputs/apk/debug/*.apk
